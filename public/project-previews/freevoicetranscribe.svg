      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#2e1065" flood-opacity=".28"/>
    </filter>
  </defs>
